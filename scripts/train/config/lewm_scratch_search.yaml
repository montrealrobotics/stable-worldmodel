# Search InfoNCE from scratch. The base LeWM objective is unchanged (two-frame
# clips over every episode, MSE + SIGReg, base-run epochs); the InfoNCE gets
# its own search.batch_size clips of history + horizon frames per batch
# (separate_clips). Only the search settings come from lewm_search.
defaults:
  - lewm_search
  - _self_

init_from: null
output_model_name: lewm_scratch_search
save_step_interval: 5000
save_epoch_interval: 5

data:
  dataset:
    num_steps: ${eval:'${wm.history_size} + ${wm.num_preds}'}

optimizer:
  lr: 1e-4

trainer:
  max_epochs: 20
  max_steps: -1
  val_check_interval: 1.0
  limit_val_batches: 1.0

loader:
  batch_size: 1024

loss:
  search:
    weight: 0.01
    horizon: 5
    batch_size: 256 # search clips per batch, loaded separately
    separate_clips: true
