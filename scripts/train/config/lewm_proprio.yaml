# LeWM with robot proprioception fused into each frame's latent.
# Train with scripts/train/lewm.py --config-name=lewm_proprio; the script adds
# proprio_columns to the loaded keys and sizes proprio_encoder from the data.
defaults:
  - lewm
  - _self_

output_model_name: lewm_proprio
proprio_embed_dim: 64

model:
  _target_: stable_worldmodel.wm.lewm.LeWMProprio
  # Joint angles and end-effector (TCP) pose; avoid privileged object state.
  proprio_columns: [obs_agent_qpos, obs_extra_tcp_pose]
  proprio_encoder:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ???
    hidden_dim: 256
    output_dim: ${proprio_embed_dim}
    norm_fn:
      _target_: torch.nn.LayerNorm
      _partial_: true
  projector:
    input_dim: ${eval:'${embed_dim} + ${proprio_embed_dim}'}
