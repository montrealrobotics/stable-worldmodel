# Search-aware post-training: rank the expert plan above a short CEM's elites.
defaults:
  - lewm
  - _self_

init_from: ??? # pretrained LeWM weights_epoch_N.pt or folder
output_model_name: lewm_search
save_step_interval: 2500 # weights_step_N.pt; runs end before epoch 5

data:
  dataset:
    num_steps: ${eval:'${wm.history_size} + ${loss.search.horizon}'}

optimizer:
  lr: 1e-5

trainer:
  max_steps: 10000
  # Step-based runs end mid-epoch, so validate on a step schedule instead.
  val_check_interval: 500
  limit_val_batches: 50

loader:
  batch_size: 64

loss:
  search:
    weight: 1.0
    horizon: 5 # planning horizon in action blocks, match eval
    bptt: true # false: gradients only from the last prediction step
    cem_steps: 5 # no-grad CEM iterations whose elites become negatives
    num_samples: 64 # CEM population per iteration
    topk: 8 # elites per iteration; loss ranks expert vs cem_steps * topk
    num_perturbed: 16 # expert + Gaussian noise negatives, block shortcut learning
    perturb_std: 0.5 # noise std in normalized action units
    var_scale: 1.0 # match solver.var_scale
    temperature: 1.0 # scale on summed goal MSE
    # cem: CEM elites + perturbed experts are the negatives (settings above).
    # gfn: a co-trained GFlowNet policy samples them (settings in loss.gfn).
    sampler: cem
    batch_size: null # search loss on the first N clips of each batch; null = all
  gfn:
    num_samples: 56 # negatives per clip (CEM uses 16 perturbed + 40 elites)
    explore_std: 1.5 # widen sampling for exploration; TB stays exact
    # Reward exp(-cost / tau), tau annealed geometrically over anneal_steps
    # (batches). Goal costs are ~70 for the expert and ~300 for random plans.
    tau_start: 50.0
    tau_end: 5.0
    anneal_steps: ${trainer.max_steps}
    expert_tb: true # also fit TB on the expert plan (off-policy)
    wm_every: 2 # policy steps per world-model step
    optimizer:
      type: AdamW
      lr: 3e-4
      weight_decay: 0.0
    policy:
      _target_: stable_worldmodel.wm.lewm.PlanGFlowNet
      emb_dim: ${embed_dim}
      action_dim: ${model.action_encoder.input_dim}
      horizon: ${loss.search.horizon}
      hidden_dim: 256
      num_components: 4
